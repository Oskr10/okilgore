    <rect x="400" y="226" width="150" height="16" fill="#6e6a5b"/>
    <rect x="470" y="270" width="210" height="16" fill="#6e6a5b"/>
    <rect x="860" y="314" width="180" height="16" fill="#b03a1e"/>
